<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Gym Tracker</title>
  <meta name="description" content="Personal gym workout tracker — offline-first." />
  <meta name="theme-color" content="#0b0d0f" />

  <!-- PWA / installable -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gym" />

  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/screens.css" />
  <link rel="stylesheet" href="css/stats.css" />
</head>
<body>
  <!-- Screens: all present in the DOM, toggled by the hash router in ui.js.
       Each is filled by its render function; JS never uses innerHTML with data.
       Tab screens (#s-log, #s-routines, #s-stats) show the bottom tab bar; the
       fullscreen screens (#s-workout, #s-pick, #s-settings) hide it via the
       `fullscreen` body class. -->
  <main id="app">
    <section id="s-log" class="screen" hidden></section>
    <section id="s-routines" class="screen" hidden></section>
    <section id="s-stats" class="screen" hidden></section>
    <section id="s-settings" class="screen" hidden></section>
    <section id="s-workout" class="screen" hidden></section>
    <section id="s-pick" class="screen" hidden></section>
  </main>

  <!-- Bottom tab bar. ui.js wires clicks by data-tab and marks the active one.
       Hidden on fullscreen routes. -->
  <nav id="tabbar" aria-label="Primary">
    <button type="button" data-tab="log" aria-label="Log">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 5a2 2 0 0 1 2-2h11a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H6a2 2 0 0 1-2-2z" />
        <path d="M8 3v18" />
      </svg>
      <span>Log</span>
    </button>
    <button type="button" data-tab="routines" aria-label="Routines">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="5" y="4" width="14" height="16" rx="2" />
        <path d="M9 8h6M9 12h6M9 16h4" />
      </svg>
      <span>Routines</span>
    </button>
    <button type="button" data-tab="stats" aria-label="Statistics">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 20V10M12 20V4M18 20v-7" />
      </svg>
      <span>Statistics</span>
    </button>
  </nav>

  <!-- Bottom sheets render here (dimmed backdrop + slide-up sheet). -->
  <div id="sheet-root"></div>

  <!-- Resume bar: shown above the tab bar when a workout is in progress but
       minimised (i.e. on any tab screen). Tap to return to the workout. -->
  <button id="resume-bar" class="resume-bar" type="button" hidden>
    <span class="resume-bar-chev" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6" /></svg>
    </span>
    <span class="resume-bar-label">Resume Workout</span>
    <span id="resume-bar-time" class="resume-bar-time">0:00</span>
  </button>

  <!-- Rest timer bar lives in the shell so it overlays every screen. -->
  <button id="rest-bar" class="rest-bar" type="button" hidden aria-label="Dismiss rest timer">
    <span class="rest-bar-label">Rest</span>
    <span id="rest-bar-time" class="rest-bar-time">0:00</span>
    <span class="rest-bar-hint">tap to dismiss</span>
  </button>

  <script type="module" src="js/ui.js"></script>
</body>
</html>
