<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gym Tracker — data + query layer tests</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        padding: 1.25rem;
        max-width: 900px;
      }
      h1 { font-size: 1.25rem; margin: 0 0 0.25rem; }
      p.sub { margin: 0 0 1rem; opacity: 0.7; }
      #summary { font-weight: 700; padding: 0.6rem 0.75rem; border-radius: 6px; margin: 0 0 1rem; }
      #results > div { padding: 0.15rem 0.5rem; border-radius: 4px; white-space: pre-wrap; }
      .ok { color: #0a7d2c; }
      .bad { color: #c0182b; background: rgba(192, 24, 43, 0.08); }
      .summary.ok { background: rgba(10, 125, 44, 0.12); }
      .summary.bad { background: rgba(192, 24, 43, 0.12); }
      @media (prefers-color-scheme: dark) {
        .ok { color: #4ade80; }
        .bad { color: #f87171; }
      }
    </style>
  </head>
  <body>
    <h1>Gym Tracker — data + query layer tests</h1>
    <p class="sub">
      Runs against a throwaway IndexedDB database (<code>healthhub-test</code>).
      Serve this folder over HTTP (ES modules + IndexedDB need a real origin),
      e.g. <code>python3 -m http.server</code> from the repo root, then open
      <code>/tests/test.html</code>.
    </p>
    <div id="summary" class="summary">Running…</div>
    <div id="results"></div>

    <script type="module">
      import { runTests } from './assertions.js';
      runTests(document.getElementById('results'), document.getElementById('summary'));
    </script>
  </body>
</html>
